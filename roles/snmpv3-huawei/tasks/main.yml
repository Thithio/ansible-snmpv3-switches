---
# Mesmo fluxo da role snmpv3-cisco: verifica, pula se já está tudo lá,
# aplica só o que estiver fora do padrão e confere de novo.
- name: SNMPv3 e trap (verificar, pular ou aplicar)
  block:
    - name: Verificar SNMPv3/trap atual do switch
      ansible.builtin.include_tasks: verificar.yml

    - name: Guardar a decisão antes de aplicar
      ansible.builtin.set_fact:
        snmpv3_precisa_aplicar: "{{ not (snmpv3_conforme | bool) }}"
        snmpv3_faltando_antes: "{{ snmpv3_faltando }}"

    - name: Switch já conforme, pular
      ansible.builtin.set_fact:
        snmpv3_resultado: pulado
      when: not (snmpv3_precisa_aplicar | bool)

    - name: Modo só verificar, registrar o que falta sem aplicar
      ansible.builtin.set_fact:
        snmpv3_resultado: pendente
      when:
        - snmpv3_precisa_aplicar | bool
        - snmpv3_somente_verificar | bool

    - name: Aplicar e conferir (só switch fora do padrão)
      when:
        - snmpv3_precisa_aplicar | bool
        - not (snmpv3_somente_verificar | bool)
      block:
        - name: Mostrar o que falta neste switch
          ansible.builtin.debug:
            msg: "Faltando: {{ snmpv3_faltando | join(', ') }}"

        - name: Aplicar configuração SNMPv3 (Huawei VRP)
          ansible.builtin.include_tasks: aplicar.yml

        - name: Conferir de novo depois de aplicar
          ansible.builtin.include_tasks: verificar.yml

        - name: Falhar se ainda faltar algo
          ansible.builtin.assert:
            that: snmpv3_conforme | bool
            fail_msg: "Depois de aplicar ainda falta: {{ snmpv3_faltando | join(', ') }}"
            quiet: true

        - name: Registrar que este switch recebeu a config
          ansible.builtin.set_fact:
            snmpv3_resultado: aplicado
  rescue:
    - name: Sair do system-view se a falha aconteceu no meio da config
      ansible.netcommon.cli_command:
        command: return
      ignore_errors: true
      ignore_unreachable: true

    - name: Registrar falha (aparece no resumo do fim)
      ansible.builtin.set_fact:
        snmpv3_resultado: falhou
        snmpv3_erro: "{{ ansible_failed_result.msg | default('erro sem mensagem') }}"
